set timeout=4
set default=0
insmod all_video
insmod gfxterm
insmod png
loadfont unicode
set gfxmode=auto
terminal_output gfxterm
set theme=/boot/grub/themes/wisp/theme.txt

menuentry "Wisp OS @VERSION@  (live)" {
	linux /boot/vmlinuz wisp.label=@LABEL@ quiet loglevel=3 console=tty3 vt.global_cursor_default=0
	initrd /boot/initramfs
}
menuentry "Wisp OS  (live, load into RAM - needs 2 GB)" {
	linux /boot/vmlinuz wisp.label=@LABEL@ wisp.toram quiet loglevel=3 console=tty3 vt.global_cursor_default=0
	initrd /boot/initramfs
}
menuentry "Wisp OS  (safe graphics)" {
	linux /boot/vmlinuz wisp.label=@LABEL@ nomodeset
	initrd /boot/initramfs
}
menuentry "Wisp OS  (debug: serial console)" {
	linux /boot/vmlinuz wisp.label=@LABEL@ wisp.serial console=tty0 console=ttyS0,115200
	initrd /boot/initramfs
}
if [ "$grub_platform" = "efi" ]; then
	menuentry "Firmware settings" { fwsetup }
fi
menuentry "Reboot" { reboot }
menuentry "Power off" { halt }
