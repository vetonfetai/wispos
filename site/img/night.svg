<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d13"/>
      <stop offset=".55" stop-color="#10131d"/>
      <stop offset="1" stop-color="#151026"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8ab4ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8ab4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b48cff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wisp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ab4ff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#8ab4ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
