  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="1380" cy="420" rx="620" ry="420" fill="url(#glowB)" opacity=".55"/>
  <ellipse cx="520" cy="760" rx="700" ry="380" fill="url(#glowA)" opacity=".35"/>
  <g fill="none" stroke="url(#wisp)" stroke-linecap="round">
