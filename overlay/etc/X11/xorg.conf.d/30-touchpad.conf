Section "InputClass"
	Identifier "touchpad"
	MatchIsTouchpad "on"
	Driver "libinput"
	Option "Tapping" "on"
	Option "NaturalScrolling" "false"
	Option "DisableWhileTyping" "on"
EndSection

Section "InputClass"
	Identifier "trackpoint"
	MatchProduct "TrackPoint"
	Driver "libinput"
	Option "AccelSpeed" "0.3"
EndSection
