# Plays video and music. Shows a window with controls even for audio files.
force-window=immediate
keep-open=yes
hwdec=auto-safe
volume-max=150
osd-font="Inter"
osd-font-size=36
script-opts=osc-seekbarstyle=bar,osc-boxalpha=60
[extension.mp3]
geometry=600x340
[extension.flac]
geometry=600x340
[extension.ogg]
geometry=600x340
