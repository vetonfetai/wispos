-- Wisp desktop widget: clock, date, weather
conky.config = {
	alignment = 'top_right',
	gap_x = 44,
	gap_y = 48,
	minimum_width = 300,
	own_window = true,
	own_window_class = 'Conky',
	own_window_type = 'desktop',
	own_window_argb_visual = true,
	own_window_argb_value = 0,
	own_window_transparent = true,
	own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
	double_buffer = true,
	use_xft = true,
	font = 'Inter:size=11',
	default_color = 'e6e9f2',
	color1 = 'b8bdd0',
	color2 = '8ab4ff',
	draw_shades = true,
	default_shade_color = '00000066',
	draw_outline = false,
	draw_borders = false,
	update_interval = 5,
	cpu_avg_samples = 1,
	no_buffers = true,
	background = false,
}

conky.text = [[
${alignr}${font Inter:light:size=60}${time %H:%M}${font}
${alignr}${voffset -6}${font Inter:medium:size=14}${color1}${time %A, %d %B}${color}${font}
${voffset 6}${alignr}${font Inter:size=12}${color2}${execi 900 wisp-weather}${color}${font}
]]
