# Lightweight effects: rounded corners + soft shadows on the CPU-friendly xrender backend.
# Turn off with "Toggle Effects" in the desktop menu if your machine is very old.
backend = "xrender";
vsync = true;
use-damage = true;
unredir-if-possible = true;
detect-client-opacity = true;
detect-rounded-corners = true;

corner-radius = 10;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.38;
shadow-offset-x = -14;
shadow-offset-y = -10;

fading = true;
fade-in-step = 0.09;
fade-out-step = 0.09;
fade-delta = 8;

rules: (
	{ match = "window_type = 'dock' || window_type = 'desktop'"; corner-radius = 0; shadow = false; },
	{ match = "window_type = 'tooltip' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'menu'"; shadow = false; corner-radius = 6; },
	{ match = "fullscreen || maximized"; corner-radius = 0; },
	{ match = "_GTK_FRAME_EXTENTS@"; shadow = false; corner-radius = 0; },
	{ match = "class_g = 'Rofi'"; corner-radius = 16; },
	{ match = "class_g = 'Dunst'"; corner-radius = 14; },
	{ match = "class_g = 'i3lock'"; corner-radius = 0; shadow = false; fade = false; },
)
